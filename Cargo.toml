[workspace]
resolver = "2"
members = [
    "crates/xiaopeng-common",
    "crates/xiaopeng-dom",
    "crates/xiaopeng-parser",
    "crates/xiaopeng-style",
    "crates/xiaopeng-layout",
    "crates/xiaopeng-renderer",
    "crates/xiaopeng-net",
    "crates/xiaopeng-script",
    "crates/xiaopeng-engine",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["XiaopengKernel Team"]
license = "CAOSL-2.0"

[workspace.dependencies]
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1.43", features = ["full"] }
url = "2.5"
boa_engine = { version = "0.20" }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
webpki-roots = "0.26"
quinn = { version = "0.11", features = ["rustls"] }
h3 = "0.0.6"
h3-quinn = "0.0.7"
bytes = "1"
lru = "0.12"
http = "1"
winit = "0.30"

# Local workspace members
xiaopeng-common = { path = "crates/xiaopeng-common" }
xiaopeng-dom = { path = "crates/xiaopeng-dom" }
xiaopeng-parser = { path = "crates/xiaopeng-parser" }
xiaopeng-style = { path = "crates/xiaopeng-style" }
xiaopeng-layout = { path = "crates/xiaopeng-layout" }
xiaopeng-renderer = { path = "crates/xiaopeng-renderer" }
xiaopeng-net = { path = "crates/xiaopeng-net" }
xiaopeng-script = { path = "crates/xiaopeng-script" }
xiaopeng-engine = { path = "crates/xiaopeng-engine" }

[patch.crates-io]
h3-quinn = { path = "vendor/h3-quinn" }
